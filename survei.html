<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Kepuasan Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 1.5rem;
        }
        main {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }
        legend {
            font-weight: bold;
            color: #1e3a8a;
            padding: 0 0.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            font-size: 0.95rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .radio-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }
        .radio-group label {
            font-weight: normal;
            display: inline;
            cursor: pointer;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input {
            width: auto;
        }
        .checkbox-group label {
            font-weight: normal;
            margin-bottom: 0;
        }
        button {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-net: 4px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Survei Kepuasan Mahasiswa</h1>
        <p>Bantu kami meningkatkan kualitas layanan kampus</p>
    </header>

    <main>
        <form action="#" method="POST">
            <!-- Fieldset 1: Data Diri -->
            <fieldset>
                <legend>Identitas Mahasiswa</legend>
                
                <div class="form-group">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="nim">NIM:</label>
                    <input type="text" id="nim" name="nim" required minlength="8" placeholder="Minimal 8 karakter">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="nama@email.com">
                </div>

                <div class="form-group">
                    <label for="fakultas">Fakultas:</label>
                    <select id="fakultas" name="fakultas" required>
                        <option value="">-- Pilih Fakultas --</option>
                        <option value="Teknik">Fakultas Teknik</option>
                        <option value="Ekonomi dan Bisnis">Fakultas Ekonomi dan Bisnis</option>
                        <option value="Ilmu Komputer">Fakultas Ilmu Komputer</option>
                        <option value="Hukum">Fakultas Hukum</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester saat ini:</label>
                    <input type="number" id="semester" name="semester" min="1" max="8" required>
                </div>
            </fieldset>

            <!-- Fieldset 2: Tingkat Kepuasan -->
            <fieldset>
                <legend>Tingkat Kepuasan (1-5)</legend>
                <div class="radio-group">
                    <label><input type="radio" name="kepuasan" value="1" required> 1</label>
                    <label><input type="radio" name="kepuasan" value="2" required> 2</label>
                    <label><input type="radio" name="kepuasan" value="3" required> 3</label>
                    <label><input type="radio" name="kepuasan" value="4" required> 4</label>
                    <label><input type="radio" name="kepuasan" value="5" required> 5</label>
                </div>
            </fieldset>

            <!-- Fieldset 3: Saran & Persetujuan -->
            <fieldset>
                <legend>Saran & Masukan</legend>

                <div class="form-group">
                    <label for="saran">Saran / Keluhan:</label>
                    <textarea id="saran" name="saran" rows="5" placeholder="Contoh: Perlu perbaikan fasilitas Wi-Fi di gedung perkuliahan."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="setuju" name="setuju">
                    <label for="setuju">Setuju dihubungi lebih lanjut</label>
                </div>
            </fieldset>

            <button type="submit">Kirim Survei</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Layanan Kemahasiswaan Kampus. Hak Cipta Dilindungi.</p>
    </footer>

</body>
</html>
